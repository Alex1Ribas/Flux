openapi: 3.0.3
info:
  title: Finance API
  version: 1.0.0
  description: Personal finance management API
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorMessage:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, confPassword]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        confPassword:
          type: string
    CreateDependenteRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, confPassword]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        confPassword:
          type: string
    LoginUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, DEPENDENT]
    CaixaRequest:
      type: object
      additionalProperties: false
      required: [nome, tipo]
      properties:
        nome:
          type: string
        saldo:
          type: number
        tipo:
          type: string
          enum: [objetivo, orcamento]
        meta:
          type: number
        aporteMensal:
          type: number
        orcamentoMensal:
          type: number
    CaixaUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        nome:
          type: string
        saldo:
          type: number
        tipo:
          type: string
          enum: [objetivo, orcamento]
        meta:
          type: number
        aporteMensal:
          type: number
        orcamentoMensal:
          type: number
    ContaRequest:
      type: object
      additionalProperties: false
      required: [tipo, descricao, valor, vencimento, caixaId]
      properties:
        tipo:
          type: string
          enum: [a_pagar, a_receber]
        descricao:
          type: string
        valor:
          type: number
        competencia:
          type: string
          description: Occurrence month in yyyy-mm
        vencimento:
          type: string
          description: Due date in yyyy-mm-dd
        caixaId:
          type: string
        recorrenteId:
          type: string
          description: Optional recurring template that originated this occurrence
    ContaUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [a_pagar, a_receber]
        descricao:
          type: string
        valor:
          type: number
        competencia:
          type: string
        vencimento:
          type: string
        caixaId:
          type: string
        status:
          type: string
          enum: [aberta, cancelada]
        recorrenteId:
          type: string
    ContaLiquidarRequest:
      type: object
      additionalProperties: false
      properties:
        liquidadoEm:
          type: string
          description: Settlement date in yyyy-mm-dd
        caixaId:
          type: string
        caixaCompensacao:
          type: string
    ContasListaPaginada:
      type: object
      additionalProperties: false
      required: [items, total, pageSize, lastItemId, hasMore]
      properties:
        items:
          type: array
          items:
            type: object
        total:
          type: integer
        pageSize:
          type: integer
        lastItemId:
          type: string
          nullable: true
          description: Cursor for the next page (`_id` of the last item)
        hasMore:
          type: boolean
    DistribuicaoLancamento:
      type: object
      additionalProperties: false
      required: [caixa, valor]
      properties:
        caixa:
          type: string
        valor:
          type: number
    LancamentoRequest:
      type: object
      additionalProperties: false
      required: [tipo, horizonte, valor, descricao, competencia]
      properties:
        tipo:
          type: string
          enum: [entrada, saida]
        horizonte:
          type: string
          enum: [presente, futuro]
        valor:
          type: number
        descricao:
          type: string
        competencia:
          type: string
        observacao:
          type: string
        caixaOrigem:
          type: string
        caixaCompensacao:
          type: string
        distribuicao:
          type: array
          items:
            $ref: '#/components/schemas/DistribuicaoLancamento'
        parcelaRef:
          type: string
        parcelaNum:
          type: number
        totalParcelas:
          type: number
        recorrente:
          type: boolean
        competenciaInicial:
          type: string
        duracaoMeses:
          type: number
        ativo:
          type: boolean
        mesesAbatidos:
          type: number
    LancamentoUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum: [entrada, saida]
        horizonte:
          type: string
          enum: [presente, futuro]
        valor:
          type: number
        descricao:
          type: string
        competencia:
          type: string
        observacao:
          type: string
        caixaOrigem:
          type: string
        caixaCompensacao:
          type: string
        distribuicao:
          type: array
          items:
            $ref: '#/components/schemas/DistribuicaoLancamento'
        parcelaRef:
          type: string
        parcelaNum:
          type: number
        totalParcelas:
          type: number
        recorrente:
          type: boolean
        competenciaInicial:
          type: string
        duracaoMeses:
          type: number
        ativo:
          type: boolean
        mesesAbatidos:
          type: number
    OrcamentoItemRequest:
      type: object
      additionalProperties: false
      required: [caixa, valor]
      properties:
        caixa:
          type: string
        valor:
          type: number
    OrcamentoRequest:
      type: object
      additionalProperties: false
      required: [orcamentos]
      properties:
        orcamentos:
          type: array
          items:
            $ref: '#/components/schemas/OrcamentoItemRequest'
    LimitesRiscoRequest:
      type: object
      additionalProperties: false
      required: [saudavel, atencao]
      properties:
        saudavel:
          type: number
        atencao:
          type: number
    ConfigLimitesRiscoRequest:
      type: object
      additionalProperties: false
      required: [global, porCaixa]
      properties:
        global:
          $ref: '#/components/schemas/LimitesRiscoRequest'
        porCaixa:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LimitesRiscoRequest'
    PreferenciasUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        tiposEntrada:
          type: array
          items:
            type: string
        tiposSaida:
          type: array
          items:
            type: string
        limitesRisco:
          $ref: '#/components/schemas/ConfigLimitesRiscoRequest'
    CategoriaCreateRequest:
      type: object
      additionalProperties: false
      required: [tipo, categoria]
      properties:
        tipo:
          type: string
          enum: [entrada, saida]
        categoria:
          type: string
          minLength: 1
    CategoriaCreateResponse:
      type: object
      additionalProperties: false
      required: [tipo, categoria]
      properties:
        tipo:
          type: string
          enum: [entrada, saida]
        categoria:
          type: string
    RiscoPrevisto:
      type: object
      additionalProperties: false
      required: [entradaPrevista, comprometido, risco]
      properties:
        entradaPrevista:
          type: number
        comprometido:
          type: number
        risco:
          type: number
    LimitesRiscoMensal:
      type: object
      additionalProperties: false
      required: [saudavel, atencao]
      properties:
        saudavel:
          type: number
        atencao:
          type: number
    PontoEvolucaoRisco:
      type: object
      additionalProperties: false
      required: [dia, label, riscoEsperado, riscoReal, diferencial]
      properties:
        dia:
          type: number
        label:
          type: string
        riscoEsperado:
          type: number
        riscoReal:
          type: number
        diferencial:
          type: number
    CompromissoMes:
      type: object
      additionalProperties: false
      required: [id, descricao, tipo, valor]
      properties:
        id:
          type: string
        descricao:
          type: string
        tipo:
          type: string
          enum: [entrada, saida]
        valor:
          type: number
        dia:
          type: number
          nullable: true
    ComposicaoRisco:
      type: object
      additionalProperties: false
      required: [descricao, valor, percentual]
      properties:
        descricao:
          type: string
        valor:
          type: number
        percentual:
          type: number
    ImpactoRisco:
      type: object
      additionalProperties: false
      required: [id, descricao, tipo, valor, impactoRisco, competencia, direcao]
      properties:
        id:
          type: string
        descricao:
          type: string
        tipo:
          type: string
          enum: [despesa_futura, parcelamento, renda_extra, realizacao, abatimento, outro]
        valor:
          type: number
        impactoRisco:
          type: number
        competencia:
          type: string
        direcao:
          type: string
          enum: [aumenta, reduz]
    AcompanhamentoMes:
      type: object
      additionalProperties: false
      required:
        - competencia
        - risco
        - riscoReal
        - diferencial
        - diferencialValor
        - status
        - dentroPlanejado
        - limites
        - evolucao
        - compromissos
        - composicao
        - impactos
      properties:
        competencia:
          type: string
        risco:
          $ref: '#/components/schemas/RiscoPrevisto'
        riscoReal:
          $ref: '#/components/schemas/RiscoPrevisto'
        diferencial:
          type: number
        diferencialValor:
          type: number
        status:
          type: string
          enum: [saudavel, atencao, critico]
        dentroPlanejado:
          type: boolean
        limites:
          $ref: '#/components/schemas/LimitesRiscoMensal'
        evolucao:
          type: array
          items:
            $ref: '#/components/schemas/PontoEvolucaoRisco'
        compromissos:
          type: array
          items:
            $ref: '#/components/schemas/CompromissoMes'
        composicao:
          type: array
          items:
            $ref: '#/components/schemas/ComposicaoRisco'
        impactos:
          type: array
          items:
            $ref: '#/components/schemas/ImpactoRisco'
    CompensationSource:
      type: object
      additionalProperties: false
      required: [id, tipoOrigem, origemId, valorMensalDestinado]
      properties:
        id:
          type: string
        tipoOrigem:
          type: string
          enum: [orcamento, objetivo]
        origemId:
          type: string
        valorMensalDestinado:
          type: number
    SimulacaoImpactoRequest:
      type: object
      additionalProperties: false
      required:
        - valorTotal
        - duracaoMeses
        - dataPrimeiroPagamento
        - modoCompensacao
        - fontesDeCompensacao
      properties:
        valorTotal:
          type: number
        duracaoMeses:
          type: number
        dataPrimeiroPagamento:
          type: string
        modoCompensacao:
          type: string
          enum: [declarada, nao-declarada]
        fontesDeCompensacao:
          type: array
          items:
            $ref: '#/components/schemas/CompensationSource'
    MonthlyImpact:
      type: object
      additionalProperties: false
      required:
        - referenciaMes
        - entradasPrevistas
        - compromissosAnteriores
        - novaParcela
        - totalComprometido
        - comprometimentoAntes
        - comprometimentoDepois
        - variacaoComprometimento
        - classificacaoAntes
        - classificacaoDepois
        - alertas
      properties:
        referenciaMes:
          type: string
        entradasPrevistas:
          type: number
        compromissosAnteriores:
          type: number
        novaParcela:
          type: number
        totalComprometido:
          type: number
        comprometimentoAntes:
          type: number
          nullable: true
        comprometimentoDepois:
          type: number
          nullable: true
        variacaoComprometimento:
          type: number
          nullable: true
        classificacaoAntes:
          type: string
          enum: [saudavel, atencao, critico]
        classificacaoDepois:
          type: string
          enum: [saudavel, atencao, critico]
        alertas:
          type: array
          items:
            type: string
    BudgetImpact:
      type: object
      additionalProperties: false
      required:
        - fonteId
        - nome
        - valorPlanejadoMensal
        - valorMensalDestinado
        - novoValorMensal
        - percentualReducao
        - alertas
      properties:
        fonteId:
          type: string
        nome:
          type: string
        valorPlanejadoMensal:
          type: number
        valorMensalDestinado:
          type: number
        novoValorMensal:
          type: number
        percentualReducao:
          type: number
          nullable: true
        alertas:
          type: array
          items:
            type: string
    GoalImpact:
      type: object
      additionalProperties: false
      required:
        - fonteId
        - nome
        - valorRestanteObjetivo
        - aporteMensalPlanejado
        - valorMensalDestinado
        - novoAporteMensal
        - prazoOriginalMeses
        - novoPrazoMeses
        - diferencaPrazoMeses
        - status
        - alertas
      properties:
        fonteId:
          type: string
        nome:
          type: string
        valorRestanteObjetivo:
          type: number
        aporteMensalPlanejado:
          type: number
        valorMensalDestinado:
          type: number
        novoAporteMensal:
          type: number
        prazoOriginalMeses:
          type: number
          nullable: true
        novoPrazoMeses:
          type: number
          nullable: true
        diferencaPrazoMeses:
          type: number
          nullable: true
        status:
          type: string
          enum: [normal, congelado]
        alertas:
          type: array
          items:
            type: string
    ScenarioSummary:
      type: object
      additionalProperties: false
      required:
        - totalFontesDeclaradas
        - quantidadeFontes
        - possuiOrcamento
        - possuiObjetivo
        - impactoBruto
        - piorComprometimentoDepois
        - piorMes
        - mesesCriticos
        - alertasGerais
      properties:
        totalFontesDeclaradas:
          type: number
        quantidadeFontes:
          type: number
        possuiOrcamento:
          type: boolean
        possuiObjetivo:
          type: boolean
        impactoBruto:
          type: boolean
        piorComprometimentoDepois:
          type: number
          nullable: true
        piorMes:
          type: string
          nullable: true
        mesesCriticos:
          type: number
        alertasGerais:
          type: array
          items:
            type: string
    SimulationResult:
      type: object
      additionalProperties: false
      required:
        - parcelaMensal
        - mesesAfetados
        - budgetImpacts
        - goalImpacts
        - monthlyImpacts
        - resumoImpacto
      properties:
        parcelaMensal:
          type: number
        mesesAfetados:
          type: array
          items:
            type: string
        budgetImpacts:
          type: array
          items:
            $ref: '#/components/schemas/BudgetImpact'
        goalImpacts:
          type: array
          items:
            $ref: '#/components/schemas/GoalImpact'
        monthlyImpacts:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyImpact'
        resumoImpacto:
          $ref: '#/components/schemas/ScenarioSummary'
paths:
  /api/health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/users/register:
    post:
      summary: Register first account holder (titular)
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Registration closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /api/users/login:
    post:
      summary: Login
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /api/users:
    post:
      summary: Create dependente (titular only)
      operationId: createDependente
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDependenteRequest'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    get:
      summary: List users (titular only)
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /api/users/{id}:
    get:
      summary: Get user by id
      operationId: getUserById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
    put:
      summary: Update user (titular only)
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    delete:
      summary: Delete user (titular only)
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/caixas:
    post:
      summary: Create caixa
      operationId: createCaixa
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaixaRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    get:
      summary: List caixas
      operationId: listCaixas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
  /api/caixas/{id}:
    get:
      summary: Get caixa
      operationId: getCaixa
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    put:
      summary: Update caixa
      operationId: updateCaixa
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaixaUpdateRequest'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    delete:
      summary: Delete caixa
      operationId: deleteCaixa
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
  /api/contas:
    post:
      summary: Create conta
      operationId: createConta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContaRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
    get:
      summary: List contas
      operationId: listContas
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [aberta, liquidada, cancelada]
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [a_pagar, a_receber]
        - name: competencia
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: lastItemId
          in: query
          required: false
          description: Cursor — `_id` do último item da página anterior
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContasListaPaginada'
        '401':
          description: Unauthorized
  /api/contas/sincronizar-recorrentes:
    post:
      summary: Materialize Conta occurrences from active recorrentes
      operationId: sincronizarContasRecorrentes
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
  /api/contas/{id}:
    get:
      summary: Get conta
      operationId: getConta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
        '404':
          description: Not Found
    put:
