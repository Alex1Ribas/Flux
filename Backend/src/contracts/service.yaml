openapi: 3.0.3
info:
  title: Flux API
  version: 2.0.0
  description: Flux — planejamento financeiro mensal e simulador de decisões
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/users/register:
    post:
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Usuário criado
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/users/login:
    post:
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginUserRequest"
      responses:
        "200":
          description: Token JWT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginUserResponse"
        "401":
          $ref: "#/components/responses/Error"
  /api/users/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Error"
  /api/planning:
    get:
      operationId: getPlan
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
      responses:
        "200":
          description: Planejamento mês a mês
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Error"
  /api/planning/settings:
    patch:
      operationId: updatePlanningSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanningSettingsRequest"
      responses:
        "200":
          description: Configuração atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningSettings"
        "422":
          $ref: "#/components/responses/Error"
  /api/planning/income-sources:
    post:
      operationId: createIncomeSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncomeSourceRequest"
      responses:
        "201":
          description: Fonte de renda criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeSource"
        "422":
          $ref: "#/components/responses/Error"
  /api/planning/income-sources/{id}:
    patch:
      operationId: updateIncomeSource
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIncomeSourceRequest"
      responses:
        "200":
          description: Fonte atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeSource"
        "404":
          $ref: "#/components/responses/Error"
  /api/planning/expenses:
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Conta criada
        "422":
          $ref: "#/components/responses/Error"
  /api/planning/expenses/{id}:
    patch:
      operationId: updateExpense
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
      responses:
        "204":
          description: Conta atualizada
        "404":
          $ref: "#/components/responses/Error"
  /api/planning/expenses/{id}/months/{month}:
    put:
      operationId: setExpenseMonth
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: month
          in: path
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetExpenseMonthRequest"
      responses:
        "204":
          description: Valor/fonte do mês ajustado
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /api/decisions/simulate:
    post:
      operationId: simulateDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateDecisionRequest"
      responses:
        "200":
          description: Veredito da simulação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Erro traduzido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
  schemas:
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, confPassword]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        confPassword:
          type: string
    LoginUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    LoginUserResponse:
      type: object
      required: [message, token, id]
      properties:
        message:
          type: string
        token:
          type: string
        id:
          type: string
    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [USER, DEPENDENT]
    PlanningSettings:
      type: object
      required: [id, reserveRate, initialReserve]
      properties:
        id:
          type: string
        reserveRate:
          type: number
        initialReserve:
          type: number
    IncomeSource:
      type: object
      required: [id, name, payDay, amount]
      properties:
        id:
          type: string
        name:
          type: string
        payDay:
          type: integer
        amount:
          type: number
        month:
          type: string
          nullable: true
          description: Mês da entrada avulsa (null para renda recorrente)
    PlanExpenseLine:
      type: object
      properties:
        expenseId:
          type: string
        name:
          type: string
        dueDay:
          type: integer
          nullable: true
        dueNote:
          type: string
        amount:
          type: number
        sourceId:
          type: string
        isAdjusted:
          type: boolean
        shareOfSpend:
          type: number
        shareOfIncome:
          type: number
        shareOfSource:
          type: number
    PlanSourceBreakdown:
      type: object
      properties:
        sourceId:
          type: string
        name:
          type: string
        income:
          type: number
        spend:
          type: number
        remaining:
          type: number
        commitment:
          type: number
    PlanMonth:
      type: object
      properties:
        month:
          type: string
        status:
          type: string
          enum: [past, current, projection]
        income:
          type: number
        spend:
          type: number
        surplus:
          type: number
        reserve:
          type: number
        free:
          type: number
        accumulatedReserve:
          type: number
        commitment:
          type: number
        sources:
          type: array
          items:
            $ref: "#/components/schemas/PlanSourceBreakdown"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/PlanExpenseLine"
    Plan:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        currentMonth:
          type: string
        settings:
          $ref: "#/components/schemas/PlanningSettings"
        incomeSources:
          type: array
          items:
            $ref: "#/components/schemas/IncomeSource"
        summary:
          type: object
          properties:
            monthlyIncome:
              type: number
            totalSpend:
              type: number
            commitment:
              type: number
            projectedReserve:
              type: number
            totalFree:
              type: number
        months:
          type: array
          items:
            $ref: "#/components/schemas/PlanMonth"
    UpdatePlanningSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reserveRate:
          type: number
          minimum: 0
          maximum: 100
        initialReserve:
          type: number
          minimum: 0
    CreateIncomeSourceRequest:
      type: object
      additionalProperties: false
      required: [name, payDay, amount]
      properties:
        name:
          type: string
        payDay:
          type: integer
          minimum: 1
          maximum: 31
        amount:
          type: number
          minimum: 0
        isOneTime:
          type: boolean
    UpdateIncomeSourceRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0
    CreateExpenseRequest:
      type: object
      additionalProperties: false
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number
          minimum: 0
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        dueNote:
          type: string
        sourceId:
          type: string
        startMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        installments:
          type: integer
          minimum: 1
    UpdateExpenseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
        amount:
          type: number
          minimum: 0
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          nullable: true
        dueNote:
          type: string
        sourceId:
          type: string
        endMonth:
          type: string
          nullable: true
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        resetMonthOverrides:
          type: boolean
          description: Quando true, remove os ajustes mês a mês e todos os meses passam a usar o padrão.
    SetExpenseMonthRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        amount:
          type: number
          minimum: 0
        sourceId:
          type: string
    ErrorMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    SimulateDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          type: string
          enum: [hoje, aluguel, parcela, avista]
        day:
          type: integer
        available:
          type: number
        expense:
          type: number
        description:
          type: string
        rent:
          type: number
        otherExpenses:
          type: number
        total:
          type: number
        installments:
          type: integer
        value:
          type: number
    VerdictDetail:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: string
    Verdict:
      type: object
      required:
        - kind
        - title
        - impact
        - message
        - details
      properties:
        kind:
          type: string
          enum: [ok, warn, bad, info]
        title:
          type: string
        impact:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/VerdictDetail"
